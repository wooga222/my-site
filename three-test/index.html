<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>heyGraden 3D Viewer</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #111; /* 배경색: 필요시 변경해라 */
            touch-action: none;
        }
        canvas {
            display: block;
            width: 100vw;
            height: 100vh;
        }
        #loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: white;
            font-family: sans-serif;
            font-size: 16px;
            pointer-events: none;
        }
    </style>
</head>
<body>
    <div id="loading">모델 로딩 중...</div>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

        // 1. 씬 설정
        const scene = new THREE.Scene();
        
        // 2. 렌더러 설정 (블렌더 색감/조명을 그대로 가져오기 위한 핵심 설정)
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        
        // 블렌더와 유사한 색감을 내기 위한 렌더러 설정
        renderer.outputColorSpace = THREE.SRGBColorSpace;
        renderer.toneMapping = THREE.ACESFilmicToneMapping; 
        renderer.toneMappingExposure = 1.0; /* 전체 화면 밝기 조절: 어두우면 1.5, 2.0 등으로 올리고, 밝으면 0.8 등으로 내려라 */
        
        document.body.appendChild(renderer.domElement);

        // 3. 카메라 설정 (쿼터뷰 / 대각선 위에서 내려다보는 뷰)
        /* 
         * PerspectiveCamera(시야각, 비율, 최소거리, 최대거리)
         * 모델이 한눈에 안 들어오면 첫 번째 값(45)을 늘리거나 줄여라
         */
        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        
        /* 
         * 쿼터뷰 카메라 위치 설정 (X, Y, Z)
         * 모델 크기에 따라 이 수치들을 키우거나 줄여서 줌인/줌아웃 거리를 맞춰라 
         * (예: 10, 10, 10 또는 2, 5, 3 등)
         */
        camera.position.set(5, 5, 5); 

        // 4. 마우스/터치 컨트롤 설정
        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        
        /* 
         * 카메라가 바라보는 중심점 (기본은 0, 0, 0)
         * 모델의 중심이 0,0,0이 아니라면 이 수치를 조절해서 모델 가운데를 바라보게 해라
         */
        controls.target.set(0, 0, 0); 

        // 5. 조명 설정 제거 (블렌더 조명을 사용하므로 Three.js 조명은 추가하지 않음)

        // 6. heyGraden.glb 불러오기
        const loader = new GLTFLoader();
        loader.load(
            './heyGraden.glb', 
            (gltf) => {
                const model = gltf.scene;
                scene.add(model);

                // 로딩 문구 제거
                const loadingEl = document.getElementById('loading');
                if (loadingEl) loadingEl.remove();
            },
            (xhr) => {
                const percent = (xhr.loaded / xhr.total) * 100;
                console.log('Loading: ' + Math.round(percent) + '%');
            },
            (error) => {
                console.error('모델 로딩 실패:', error);
                document.getElementById('loading').innerText = '모델을 불러오지 못했습니다. 파일명을 확인해주세요.';
            }
        );

        // 7. 화면 크기 변경 대응
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // 8. 렌더링 루프
        function animate() {
            requestAnimationFrame(animate);
            controls.update(); // enableDamping을 위해 필수
            renderer.render(scene, camera);
        }
        animate();
    </script>
</body>
</html>
