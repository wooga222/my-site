<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>heyGraden 3D Viewer</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #BCDEE0;
            touch-action: none;
        }
        canvas {
            display: block;
            width: 100vw;
            height: 100vh;
        }
        #loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: white;
            font-family: sans-serif;
            font-size: 16px;
            pointer-events: none;
        }
    </style>
</head>
<body>
    <div id="loading">모델 로딩 중...</div>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

        // 1. 씬, 카메라, 렌더러 생성
        const scene = new THREE.Scene();
        scene.background = new THREE.Color('#BCDEE0'); // 👈 이 줄을 추가하세요!
        
        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.outputColorSpace = THREE.SRGBColorSpace;
        document.body.appendChild(renderer.domElement);

        // 2. 조명 켜기 (윈도우 3D 뷰어처럼 기본적으로 잘 보이게 설정)
        const ambientLight = new THREE.AmbientLight(0xffffff, 1.0); // 전체를 은은하게 밝히는 빛
        scene.add(ambientLight);

        const directionalLight = new THREE.DirectionalLight(0xECE9D8, 1.5); // 따뜻한 빛 색상으로 변경
        directionalLight.position.set(10, 15, 10);
        scene.add(directionalLight);

        // 3. 컨트롤 설정 (이미 좌클릭=회전, 우클릭=이동, 휠=줌인/아웃이 기본 적용됩니다!)
        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;

        // 4. 모델 불러오기
        const loader = new GLTFLoader();
        loader.load(
            './heyGraden.glb', 
            (gltf) => {
                const model = gltf.scene;
                scene.add(model);

                // --- 💡 핵심: 모델 크기와 위치를 자동으로 계산해서 카메라를 세팅해줌 ---
                const box = new THREE.Box3().setFromObject(model);
                const center = box.getCenter(new THREE.Vector3());
                const size = box.getSize(new THREE.Vector3());

                // 모델의 가장 큰 면적을 기준으로 카메라 거리 계산
                const maxDim = Math.max(size.x, size.y, size.z);
                const fov = camera.fov * (Math.PI / 180);
                const cameraZ = Math.abs(maxDim / 2 / Math.tan(fov / 2)) * 1.5;

                // 약간 위쪽(쿼터뷰 느낌)에서 바라보도록 카메라 위치 세팅
                camera.position.set(center.x + cameraZ * 0.5, center.y + cameraZ * 0.5, center.z + cameraZ);
                
                // 마우스 회전의 중심점을 모델의 한가운데로 맞춤
                controls.target.copy(center);
                controls.update();
                // -----------------------------------------------------------

                const loadingEl = document.getElementById('loading');
                if (loadingEl) loadingEl.remove();
            },
            (xhr) => {
                console.log((xhr.loaded / xhr.total * 100) + '% 로딩됨');
            },
            (error) => {
                console.error('에러 발생:', error);
                document.getElementById('loading').innerText = '에러! F12를 눌러 콘솔창을 확인하세요.';
            }
        );

        // 5. 창 크기 변경 시 대응
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // 6. 애니메이션(렌더링) 무한 반복
        function animate() {
            requestAnimationFrame(animate);
            controls.update(); // 부드러운 움직임(Damping)을 위해 필수
            renderer.render(scene, camera);
        }
        animate();
    </script>
</body>
</html>
