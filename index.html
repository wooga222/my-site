<!DOCTYPE html>
<html lang="ko"><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
    @font-face {
        font-family: 'ManhwaPromotionAgency';
        src:
            url('https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_seven@1.2/KOMACON.woff') format('woff');
        font-weight: normal;
        font-display: swap;
}
    
    * {
        box-sizing: border-box;
    }

    body {
        font-family: 'ManhwaPromotionAgency';
        margin: 0;
        padding: 0;
    }

    .parent {
        position: relative;
        height: 6000px;
    }

    .sticky {
        position: sticky;
        height: 30px;
        display: flex;
        align-items: center;
        justify-content: center;
        background-color: white;
    }

    .sticky1 {
        top: 0;
        border-bottom: 1px solid black;
    }

    .sticky2 {
        top: 29px;
        bottom: 29px;
        border-top: 1px solid black;
        border-bottom: 1px solid black;
    }

    .sticky3 {
        top: 58px;
        bottom: 0;
        border-top: 1px solid black;
        border-bottom: 1px solid black;
    }

    .section {
        height: 1970px;
        padding: 20px;
    }
</style>
</head>

<body>

<div class="parent">
    <div class="sticky sticky1">
        STICKY 1 — TOP 0
    </div>
    <section class="section section1">
        SECTION 1<br>
        border: 1px solid black;
    </section>

    <div class="sticky sticky2">
        STICKY 2 — TOP 29 / BOTTOM 29
    </div>
    <section class="section section2">
    SECTION 2<br>
    stick height: 30px;<br>
    border-top, bottom: 1px<br>
    30 - 1 = 29
    </section>

    <div class="sticky sticky3">
        STICKY 3 — TOP 58 / BOTTOM 0
    </div>
    <section class="section section3">
        SECTION 3
    </section>

</div>

</body></html>
