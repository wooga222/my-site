<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>상세페이지 스티키 앵커 예시</title>
    <style>
        /* 기본 리셋 및 모바일 보기 편한 스타일 */
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { 
            font-family: sans-serif; 
            max-width: 480px; /* 모바일 화면 너비 가정 */
            margin: 0 auto; 
            background: #f9f9f9;
        }

        /* 1. 최상단 고정 네비게이션 바 (Sticky Nav) */
        .top-nav {
            position: sticky;
            top: 0;
            background: #ffffff;
            border-bottom: 1px solid #ddd;
            display: flex;
            justify-content: space-around;
            padding: 12px 0;
            z-index: 100; /* 내용물 위에 뜨도록 설정 */
        }
        .top-nav a {
            text-decoration: none;
            color: #333;
            font-weight: bold;
            font-size: 14px;
        }

        /* 각 섹션 스타일 */
        .section {
            /* 스크롤 시 네비게이션 바에 가리지 않도록 여백 확보 */
            scroll-margin-top: 45px; 
            margin-bottom: 40px;
        }

        /* 2. 각 섹션 내부의 스티키 타이틀 (질문하신 핵심 부분) */
        .section-title {
            position: sticky;
            top: 45px; /* 최상단 네비게이션 바로 밑에 붙음 */
            background: #ffeb33; /* 눈에 띄게 배경색 지정 */
            padding: 10px 16px;
            font-size: 16px;
            font-weight: bold;
            border-top: 1px solid #ddd;
            border-bottom: 1px solid #ddd;
            z-index: 10;
        }

        /* 3. 섹션 내용물 영역 */
        .section-content {
            background: #ffffff;
            padding: 20px 16px;
            min-height: 400px; /* 스크롤 테스트를 위해 높이 지정 */
            font-size: 14px;
            color: #666;
            line-height: 1.6;
        }
    </style>
</head>
<body>

    <!-- 최상단 고정 네비게이션 -->
    <nav class="top-nav">
        <a href="#info">상세정보</a>
        <a href="#spec">제원</a>
        <a href="#review">리뷰</a>
    </nav>

    <!-- 상세정보 섹션 -->
    <div id="info" class="section">
        <div class="section-title">상세정보</div>
        <div class="section-content">
            여기는 상품의 매력적인 상세 설명이 들어가는 공간입니다.<br>
            스크롤을 내려보세요! 제원 타이틀이 네비게이션 바로 밑에 찰싹 달라붙는 것을 볼 수 있습니다.
        </div>
    </div>

    <!-- 제원 섹션 -->
    <div id="spec" class="section">
        <div class="section-title">제원 및 스펙</div>
        <div class="section-content">
            - 사이즈: Free<br>
            - 소재: 면 100%<br>
            - 제조국: 대한민국<br>
            스펙 내용들이 쭉 나열됩니다.
        </div>
    </div>

    <!-- 리뷰 섹션 -->
    <div id="review" class="section">
        <div class="section-title">리뷰 (128)</div>
        <div class="section-content">
            ⭐ 5.0 - 너무 좋아요!<br>
            ⭐ 5.0 - 배송이 빠릅니다.<br>
            사용자들의 생생한 리뷰가 들어가는 공간입니다.
        </div>
    </div>

</body>
</html>
